<div class="h-screen flex overflow-hidden" style="background: #0e1015;">

    <!-- ─── Mobile Overlay Sidebar ─────────────────────── -->
    <div *ngIf="isSidebarOpen" class="fixed inset-0 flex z-40 md:hidden" role="dialog" aria-modal="true">
        <div class="fixed inset-0 modal-backdrop" (click)="toggleSidebar()"></div>
        <div class="relative flex flex-col w-72 flex-shrink-0 animate-slide-in-left"
            style="background: #181a20; border-right: 1px solid #2a2d35; box-shadow: 2px 0 20px rgba(0,0,0,0.5);">
            <div class="flex items-center justify-between h-16 px-6" style="border-bottom: 1px solid #2a2d35;">
                <div class="flex items-center gap-3">
                    <div class="h-9 w-9 rounded-lg flex items-center justify-center"
                        style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);">
                        <svg class="h-5 w-5" style="color:#141518" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <span class="font-display font-bold text-lg tracking-tight"
                        style="color: #f4f5f7;">ManagerOps</span>
                </div>
                <button (click)="toggleSidebar()" class="p-1.5 rounded-lg transition-colors" style="color:#6b7280">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <nav class="flex-1 px-3 py-6 space-y-1 custom-scrollbar overflow-y-auto">
                <a *ngFor="let item of navigation" [routerLink]="item.href" routerLinkActive="active" class="nav-item">
                    <svg class="flex-shrink-0 h-5 w-5 transition-colors" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" [attr.d]="item.icon" />
                    </svg>
                    {{ item.name }}
                </a>
            </nav>
        </div>
    </div>

    <!-- ─── Desktop Sidebar ────────────────────────────── -->
    <aside class="hidden md:flex md:flex-col w-[260px] flex-shrink-0"
        style="background: #181a20; border-right: 1px solid #2a2d35;">

        <!-- Logo -->
        <div class="h-16 flex items-center px-6 flex-shrink-0" style="border-bottom: 1px solid #2a2d35;">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 rounded-lg flex items-center justify-center flex-shrink-0"
                    style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);">
                    <svg class="h-5 w-5" style="color:#141518" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <span class="block font-display font-bold text-base tracking-tight"
                        style="color: #f4f5f7;">ManagerOps</span>
                    <span class="block text-xs font-mono"
                        style="color: #4b5563; font-size: 10px; letter-spacing: 0.1em;">CONTROL LOGISTIQUE</span>
                </div>
            </div>
        </div>

        <!-- Nav Items -->
        <nav class="flex-1 px-3 py-6 space-y-0.5 custom-scrollbar overflow-y-auto">
            <div class="text-xs font-semibold uppercase tracking-widest px-3 mb-3"
                style="color: #4b5563; font-family: 'Space Grotesk', sans-serif; font-size: 10px;">
                Espace Logistique
            </div>
            <a *ngFor="let item of navigation" [routerLink]="item.href" routerLinkActive="active" class="nav-item">
                <svg class="flex-shrink-0 h-4 w-4 transition-colors" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" [attr.d]="item.icon" />
                </svg>
                <span>{{ item.name }}</span>
            </a>
        </nav>

        <!-- User / Logout -->
        <div class="p-3 flex-shrink-0" style="border-top: 1px solid #2a2d35;">
            <div class="flex items-center gap-3 p-2.5 rounded-lg" style="background: #1e2025;">
                <div class="h-9 w-9 rounded-lg flex-shrink-0 flex items-center justify-center font-bold text-sm"
                    style="background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.25); font-family: 'Space Grotesk', sans-serif;">
                    LM
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold truncate"
                        style="color: #f4f5f7; font-family: 'Space Grotesk', sans-serif;">Logistics</p>
                    <p class="text-xs truncate" style="color: #4b5563; font-family: 'JetBrains Mono', monospace;">
                        Gestionnaire</p>
                </div>
                <button (click)="logout()" title="Déconnexion" class="p-1.5 rounded-lg flex-shrink-0 transition-all"
                    style="color: #6b7280;"
                    onmouseover="this.style.color='#ef4444'; this.style.background='rgba(239,68,68,0.1)'"
                    onmouseout="this.style.color='#6b7280'; this.style.background='transparent'">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- ─── Main Content ────────────────────────────────── -->
    <div class="flex flex-col flex-1 min-w-0 overflow-hidden">

        <!-- Topbar -->
        <header class="h-16 flex items-center flex-shrink-0 px-6 gap-4"
            style="background: #181a20; border-bottom: 1px solid #2a2d35;">
            <button type="button" class="md:hidden p-1.5 rounded-lg transition-colors" style="color: #6b7280;"
                (click)="toggleSidebar()">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
                </svg>
            </button>
            <div class="flex-1 max-w-sm relative">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4" style="color: #4b5563;" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="search" placeholder="Rechercher livraisons..." class="fleet-input pl-10 text-sm h-10"
                    style="background: #252830; border-radius: 10px; border-color: transparent;">
            </div>
            <div class="flex-1"></div>
            <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg"
                style="background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2);">
                <span class="live-dot" style="background: #10b981;"></span>
                <span class="text-xs font-semibold" style="color: #10b981;">Mode Gestionnaire Actif</span>
            </div>
        </header>

        <!-- Page Content -->
        <main class="flex-1 overflow-y-auto custom-scrollbar" style="background: #0e1015;">
            <div class="p-6 max-w-[1400px] mx-auto page-enter">
                <router-outlet></router-outlet>
            </div>
        </main>
    </div>
</div>
