<!-- ─── Manager Clients List Dashboard ─────────────────────────── -->
<div class="space-y-6">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <div class="flex items-center gap-2 mb-1">
                <svg class="h-4 w-4" style="color: #10b981;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
                <span class="text-xs font-mono uppercase tracking-widest" style="color: #6b7280;">Logistique /
                    Clients</span>
            </div>
            <h1 class="section-title">Portefeuille Clients</h1>
            <p class="section-subtitle">Consultez la liste de vos partenaires et leurs points de livraison</p>
        </div>
    </div>

    <!-- Loading Skeleton -->
    <div *ngIf="isLoading" class="animate-pulse space-y-2">
        <div class="h-10 rounded-lg" style="background: #1e2025;"></div>
        <div *ngFor="let x of [1,2,3,4]" class="h-14 rounded-lg" style="background: #1e2025;"></div>
    </div>

    <!-- Table Section -->
    <div *ngIf="!isLoading" class="fleet-card overflow-hidden">
        <table class="fleet-table border-collapse">
            <thead>
                <tr>
                    <th>Entreprise</th>
                    <th>Contact</th>
                    <th>Adresse</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let c of clients; let i = index"
                    class="animate-fade-in transition-colors hover:bg-[#1a1c23]"
                    [style.animationDelay]="(i * 0.05) + 's'">
                    <td>
                        <div class="flex items-center gap-3">
                            <div class="h-9 w-9 rounded-lg flex items-center justify-center flex-shrink-0"
                                style="background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.2);">
                                <span class="font-bold text-sm" style="color: #10b981;">{{ c.companyName.charAt(0) |
                                    uppercase}}</span>
                            </div>
                            <div>
                                <p class="text-sm font-semibold" style="color: #f4f5f7;">{{ c.companyName }}</p>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="flex flex-col">
                            <span class="text-sm font-mono text-gray-300">{{ c.phone }}</span>
                        </div>
                    </td>
                    <td>
                        <span class="text-sm text-gray-400 line-clamp-1 max-w-xs" [title]="c.address">{{ c.address
                            }}</span>
                    </td>
                </tr>

                <!-- Empty State -->
                <tr *ngIf="clients.length === 0">
                    <td colspan="3" class="py-20 text-center">
                        <div class="flex flex-col items-center gap-3">
                            <div class="h-14 w-14 rounded-xl flex items-center justify-center"
                                style="background: #252830; border: 1px solid #2a2d35;">
                                <svg class="h-7 w-7" style="color: #4b5563;" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                </svg>
                            </div>
                            <p class="font-display font-semibold" style="color: #9ca3af;">Aucun client trouvé</p>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
